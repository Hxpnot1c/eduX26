[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "edux"
version = "0.1.0"
description = "MCP learning service: course knowledge graph, learner model and teaching context for school chatbots"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.30,<2",
    "uvicorn",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov", "coverage>=7", "ruff", "mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:Using .httpx. with .starlette.testclient."]

[tool.setuptools]
packages = ["edux", "edux.web", "ingest"]

[tool.setuptools.package-data]
"edux.web" = ["static/**/*"]

[tool.ruff]
line-length = 140
target-version = "py311"
extend-exclude = ["data", ".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
ignore = ["UP017", "B905", "B007", "E731"]   # UP017: timezone.utc is clear and works; B905/B007/E731: style noise here

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "B017"]
"scripts/*" = ["E402"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = true
files = ["edux", "ingest"]

[tool.coverage.run]
source = ["edux", "ingest"]
branch = false

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = false
exclude_also = [
    "if __name__ == .__main__.:",
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
