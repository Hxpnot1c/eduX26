 ['Ad valorem tax',true,'Answered 3 times over 2 days','Shifts supply in parallel for an ad valorem tax.','A specific tax shifts supply in parallel. An ad valorem tax pivots it, because the tax grows with the price.','draw both taxes on one diagram and mark the tax per unit at two prices.'],
 ['Welfare loss',true,'Answered 3 times over 2 days','Shades the whole gap between the two cost curves instead of the triangle.','Draws MSC above MPC correctly, but shades the gap at every output. The loss is only the triangle between the social and market quantities.','mark the market and social quantities first, then shade only between them.'],
 ['Cross elasticity of demand',false,'Answered 5 times over 3 days','Thinks a negative XED means the goods are substitutes.','Substitutes have a positive XED: when B\'s price rises, demand for A rises. A negative XED means the goods are complements.','sort five pairs into substitutes and complements, then check the sign.']];
const AIL=[
 ['Ask','Asking with a clear purpose, context and constraints',2,'Developing, from 6 questions Garry asked over 5 days.','add a time period and a purpose, such as "UK petrol, 2025, effect on demand".'],
 ['Verify','Checking claims and sources before relying on them',2,'Developing, from 4 checks over 2 weeks.','open the source and say whether it matches.'],
 ['How AI works','Invented sources, confident errors, cut-offs, agreeing with the user',1,'New, from 2 quick questions over 1 week.','ask why a chatbot can cite a source that doesn\'t exist, then check one it gives.']];

<main style="flex: 1 1 auto; min-width: 0; background: #f4f4f0; border: 1.5px solid #1a1a1a; border-radius: 10px; padding: 32px 44px 36px; box-sizing: border-box; display: flex; flex-direction: column; gap: 24px">
<header style="display: flex; flex-wrap: wrap; gap: 16px 40px; align-items: flex-end; border-bottom: 1.5px solid #1a1a1a; padding-bottom: 18px">

<a href="#class" data-go="class" style="display: inline-flex; align-items: center; gap: 8px; ${MONO}; font-size: 13px; font-weight: 600; min-height: 32px; align-self: flex-start"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#1a1a1a" stroke-width="2.4"><path d="M15 5l-7 7 7 7"></path></svg>Economics Set 1</a>
<h1 style="margin: 0; ${MONO}; font-size: 44px; font-weight: 700; line-height: 1.1">Garry David</h1>
<p style="margin: 0; font-weight: 600; font-size: 14px">In-depth review for Economics Set 1</p></div>
<p style="margin: 0; flex: 0 1 380px; font-size: 12.5px; color: #4f4f4a">Based on 15 answers over 2 weeks. Practice feedback, not a grade. Chats are never shown here. Sample data for a design preview.</p>
</header>
<div style="display: flex; gap: 32px 72px; align-items: flex-start; flex-wrap: nowrap">
<section aria-labelledby="unsure-h" style="flex: 1 1 460px; min-width: 0; display: flex; flex-direction: column">
<h2 id="unsure-h" style="margin: 0; ${MONO}; font-size: 24px; font-weight: 600">What Garry is unsure about</h2>
<p style="margin: 6px 0 16px; font-size: 14px; color: #4f4f4a">Specific ideas and steps to revisit, from the wrong ideas Garry holds now and the points missed in recent answers.</p>
${UNSURE.map(u=>`<div style="border-top: 1.5px solid #1a1a1a; padding: 14px 0 16px; display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline"><h3 style="${H3}">${esc(u[0])}</h3>${u[1]?`<span style="${MONO}; font-size: 10.5px; font-weight: 600; border: 1px solid #1a1a1a; border-radius: 3px; padding: 0 5px">IN FRIDAY'S TEST</span>`:''}<span style="margin-left: auto; font-size: 12px; color: #33332f">${u[2]}</span></div>
<p style="margin: 0; font-size: 15px"><span style="background: #ffe14d; padding: 1px 4px">${esc(u[3])}</span></p>
<p style="margin: 0; font-size: 15px">${esc(u[4])}</p>
<p style="margin: 0; font-size: 15px"><b style="${MONO}; font-weight: 600">Try next:</b> ${esc(u[5])}</p></div>`).join('')}
<div style="border-top: 1.5px dashed #1a1a1a; padding: 14px 0 0; display: flex; flex-direction: column; gap: 4px">
<div style="display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline"><h3 style="${H3}">Not yet checked</h3><span style="margin-left: auto; font-size: 12px; color: #33332f">Public goods, Subsidies</span></div>
<p style="margin: 0; font-size: 13px; color: #4f4f4a">Taught in class and not yet answered on. Not weak, just not asked yet, so there is nothing to report.</p></div>
</section>
<section aria-labelledby="ai-h" style="flex: 1 1 460px; min-width: 0; display: flex; flex-direction: column">
<div style="display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center"><h2 id="ai-h" style="margin: 0; ${MONO}; font-size: 24px; font-weight: 600">AI literacy practice</h2><span style="${MONO}; font-size: 11.5px; font-weight: 600; background: #1a1a1a; color: #ffffff; border-radius: 999px; padding: 3px 10px">Practice feedback, not a grade</span></div>
<p style="margin: 6px 0 16px; font-size: 14px; color: #4f4f4a">Levels come from how Garry asks and checks while studying. Synapse keeps no message text, and teachers never see chats.</p>
${AIL.map(a=>{const lv=['New','Developing','Secure'];const seg=i=>`<span style="flex: 1; height: 8px; background: ${i<a[2]?'#1a1a1a':'#d2d2ca'}; border-radius: ${i===0?'4px 0 0 4px':i===2?'0 4px 4px 0':'0'}"></span>`;
 return `<div style="border-top: 1.5px solid #1a1a1a; padding: 14px 0 18px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline"><h3 style="${H3}">${a[0]}</h3><span style="margin-left: auto; font-size: 12px; color: #33332f">${a[1]}</span></div>
<div role="img" aria-label="Level: ${lv[a[2]-1].toLowerCase()}, step ${a[2]} of 3" style="display: flex; flex-direction: column; gap: 6px; max-width: 520px">
<div style="display: flex; gap: 3px">${seg(0)}${seg(1)}${seg(2)}</div>
<div style="display: flex">${lv.map((l,i)=>`<span style="flex: 1; ${MONO}; font-size: 12px; font-weight: ${i===a[2]-1?700:500}; color: ${i===a[2]-1?'#1a1a1a':'#5f5f59'}">${l}</span>`).join('')}</div></div>
<p style="margin: 0; font-size: 13px; color: #33332f">${a[3]}</p>

<p style="margin: 4px 0 0; padding-top: 12px; border-top: 1px dashed #8a8a83; font-size: 12px; color: #4f4f4a">Levels only: no percentages, scores or rankings, and no comparison with other students.</p>
</section></div></main></div>`;}

/* ---------- sign-in ---------- */
function signIn(){
  return `<div style="width: 1920px; height: 1080px; background: #dedfda; display: flex; align-items: center; justify-content: center; font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #1a1a1a">
<main style="width: 560px; background: #f4f4f0; border: 1.5px solid #1a1a1a; border-radius: 10px; padding: 44px 48px; box-sizing: border-box; display: flex; flex-direction: column; gap: 18px; align-items: flex-start">
<img src="${LOGO}" alt="Synapse" style="height: 64px; width: auto">
<div><h1 style="margin: 0; ${MONO}; font-size: 34px; font-weight: 700; line-height: 1.1">Synapse for teachers</h1>
<p style="margin: 6px 0 0; font-size: 15px; color: #4f4f4a">Economics Set 1 · A-level Economics</p></div>
<button type="button" data-go="class" style="min-height: 52px; padding: 0 26px; border-radius: 999px; border: 1.5px solid #1a1a1a; background: #1a1a1a; color: #ffffff; ${MONO}; font-size: 15px; font-weight: 600; cursor: pointer">Sign in as demo teacher</button>
<p style="margin: 0; font-size: 12.5px; color: #4f4f4a; border-top: 1px dashed #8a8a83; padding-top: 12px">Demo mode: a sample class of 12 students. Per-student view turned on by the school after its DPIA. Teachers never see chats.</p>
</main></div>`;}

/* ---------- routing, scaling, events ---------- */
const stage=document.getElementById('stage');
let view='signin';
function draw(){stage.innerHTML=view==='class'?classView():view==='garry'?garryView():signIn();}
function go(v){view=v==='signout'?'signin':v;try{history.replaceState(null,'','#'+(view==='signin'?'':view))}catch(e){}draw();window.scrollTo(0,0);}
function fit(){const s=Math.min(innerWidth/1920,innerHeight/1080);stage.style.transform=`translate(${(innerWidth-1920*s)/2}px,${(innerHeight-1080*s)/2}px) scale(${s})`;}
addEventListener('resize',fit);
stage.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');if(g){e.preventDefault();go(g.dataset.go);return}
  const a=e.target.closest('[data-act]');if(!a)return;const act=a.dataset.act;
  if(act==='taught'){st.panel=st.panel==='taught'?null:'taught';st.taughtMsg=''}
  else if(act==='test'){st.panel=st.panel==='test'?null:'test';st.testMsg=''}
  else if(act==='filter'){st.filter=a.dataset.id}
  else if(act==='markTaught'){st.taughtMsg=byId(st.taughtTopic).name+' marked as taught. Students can now get practice questions on it.'}
  else if(act==='saveTest'){const d=new Date(st.testDate+'T12:00:00');st.testMsg='Test saved for '+(isNaN(d)?'No date set':d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'}))+' with '+st.testTopics.length+' topics.'}
  else return;
  draw();});
stage.addEventListener('change',e=>{const a=e.target.closest('[data-act]');if(!a)return;const act=a.dataset.act;
  if(act==='taughtTopic'){st.taughtTopic=a.value;st.taughtMsg=''}
  else if(act==='testDate'){st.testDate=a.value;st.testMsg=''}
  else if(act==='toggleTopic'){const id=a.dataset.id;st.testTopics=st.testTopics.includes(id)?st.testTopics.filter(x=>x!==id):st.testTopics.concat([id]);st.testMsg=''}
  else return;draw();});
const h=(location.hash||'').slice(1);if(h==='class'||h==='garry')view=h;
fit();draw();
}
</script>
